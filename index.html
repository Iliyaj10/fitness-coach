<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مربی بدنسازی | باشگاه هوشمند</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial;background:#0b1118;color:#f1f5f9;line-height:2}
header{background:linear-gradient(135deg,#102b25,#172033);padding:35px 16px;text-align:center;border-bottom:2px solid #39e6a0}
header h1{font-size:30px;color:#39e6a0;margin:0}
header p{color:#cbd5e1}
nav{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:12px;background:#111a25;position:sticky;top:0}
button{font-family:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 15px;background:#39e6a0;color:#06130e;font-weight:bold}
nav button{background:#263342;color:#fff}
nav button:hover{background:#39e6a0;color:#06130e}
main{max-width:950px;margin:auto;padding:16px}
section{background:#141e2a;border:1px solid #293746;border-radius:16px;padding:20px;margin:18px 0}
h2{color:#39e6a0;margin-top:0}
h3{color:#a7f3d0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{background:#1c2938;padding:16px;border-radius:12px}
input,select{width:100%;padding:12px;border-radius:8px;background:#0b1118;color:white;border:1px solid #425164;margin:5px 0 14px;font-family:inherit}
label{display:block}
.result{padding:12px;background:#102b25;border-radius:10px;margin-top:12px;white-space:pre-line}
.small{font-size:13px;color:#a8b5c5}
footer{text-align:center;padding:25px;color:#a8b5c5}
</style>
</head>
<body>
<header>
<h1>💪 مربی بدنسازی</h1>
<p>قوی‌تر شو؛ سالم‌تر زندگی کن!</p>
<button onclick="document.getElementById('plans').scrollIntoView({behavior:'smooth'})">شروع برنامه‌ریزی</button>
</header>

<nav>
<button onclick="go('plans')">برنامه تمرینی</button>
<button onclick="go('food')">تغذیه</button>
<button onclick="go('calories')">کالری</button>
<button onclick="go('bmi')">شاخص BMI</button>
</nav>

<main>
<section id="plans">
<h2>🏋️ انتخاب برنامه تمرینی</h2>
<p>هدفت رو انتخاب کن تا راهنمای شروع رو ببینی.</p>
<label for="goal">هدف ورزشی</label>
<select id="goal">
<option value="muscle">عضله‌سازی و افزایش وزن</option>
<option value="strength">افزایش قدرت</option>
<option value="fitness">تناسب اندام</option>
<option value="endurance">افزایش استقامت</option>
</select>
<button onclick="training()">نمایش راهنما</button>
<div id="trainingResult" class="result">برنامه مناسب هدفت اینجا نمایش داده می‌شه.</div>
</section>

<section id="food">
<h2>🥗 راهنمای تغذیه</h2>
<div class="grid">
<div class="tile"><h3>🥚 پروتئین</h3><p>تخم‌مرغ
